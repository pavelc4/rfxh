name: Telegram Notify
description: Send build/release notifications to Telegram

inputs:
  bot_token:
    description: Telegram Bot Token
    required: true
  chat_id:
    description: Telegram Chat ID
    required: true
  type:
    description: Notification type (start, complete, failure)
    required: true
    default: complete
  binary_files:
    description: Comma-separated list of file paths (for complete notification)
    required: false
    default: ""
  edit_message_id:
    description: Message ID from the start notification to edit in place
    required: false
    default: ""
  caption:
    description: Custom caption override
    required: false
    default: ""

outputs:
  message_id:
    description: Sent message ID (for later deletion)
    value: ${{ steps.send.outputs.message_id }}

runs:
  using: composite
  steps:
    - name: Send
      id: send
      uses: actions/github-script@v7
      env:
        TG_TOKEN: ${{ inputs.bot_token }}
        TG_CHAT: ${{ inputs.chat_id }}
        TG_TYPE: ${{ inputs.type }}
        TG_FILES: ${{ inputs.binary_files }}
        TG_EDIT_ID: ${{ inputs.edit_message_id }}
        TG_CAPTION: ${{ inputs.caption }}
        TG_RUN_NUMBER: ${{ github.run_number }}
        TG_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        TG_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # github.action_path is the only context a composite action gets for
        # its own location, and require() needs an absolute path.
        TG_LIB: ${{ github.action_path }}/lib
      with:
        # Node ships inside every runner, so this adds no dependency: no shell,
        # no python3, no curl, no jq. The logic lives in lib/ so it can be unit
        # tested and reused outside this action.
        #
        # `return` matters: github-script awaits the script's result, so a bare
        # call() would let the step finish before Telegram replied and the
        # message_id output would be dropped.
        script: |
          return require(process.env.TG_LIB + '/send.js').run(core, process.env);
