name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
      custom_tag:
        description: "Optional suffix appended to the tag (e.g. beta, rc1)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  # Single source for the build type, so the cmake flags and the Telegram
  # caption can never disagree.
  BUILD_TYPE: Release

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      notify_message_id: ${{ steps.notify_start.outputs.message_id }}
      # tag + optional -custom_tag, resolved once so the release, the assets and
      # the Telegram caption can never disagree on what was published.
      release_tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Release Tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          echo "name=${TAG}${CUSTOM_TAG:+-$CUSTOM_TAG}" >> "$GITHUB_OUTPUT"
      - name: Notify Release Start
        if: ${{ env.BOT_TOKEN != '' }}
        id: notify_start
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          type: start

  build-linux:
    name: linux-x86_64
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@v2
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build --parallel
      - name: Strip
        run: llvm-strip --strip-all build/rfxh
      - name: Checksum
        run: node .github/scripts/checksum.js build/rfxh
      - uses: actions/upload-artifact@v4
        with:
          name: rfxh-linux-x86_64
          path: build/rfxh*

  build-macos-x86_64:
    name: macos-x86_64
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@v2
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Build
        run: cmake --build build --parallel
      - name: Strip
        run: strip --strip-all build/rfxh
      - name: Checksum
        run: node .github/scripts/checksum.js build/rfxh
      - uses: actions/upload-artifact@v4
        with:
          name: rfxh-macos-x86_64
          path: build/rfxh*

  build-macos-arm64:
    name: macos-arm64
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@v2
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build --parallel
      - name: Strip
        run: strip --strip-all build/rfxh
      - name: Checksum
        run: node .github/scripts/checksum.js build/rfxh
      - uses: actions/upload-artifact@v4
        with:
          name: rfxh-macos-arm64
          path: build/rfxh*

  build-android-arm64:
    name: android-arm64
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: true
      - uses: lukka/get-cmake@v2
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
      - name: Build
        run: cmake --build build --parallel
      - name: Strip
        run: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all build/rfxh
      - name: Checksum
        run: node .github/scripts/checksum.js build/rfxh
      - uses: actions/upload-artifact@v4
        with:
          name: rfxh-android-arm64
          path: build/rfxh*

  build-android-x86_64:
    name: android-x86_64
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: true
      - uses: lukka/get-cmake@v2
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=x86_64
          -DANDROID_PLATFORM=android-24
      - name: Build
        run: cmake --build build --parallel
      - name: Strip
        run: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all build/rfxh
      - name: Checksum
        run: node .github/scripts/checksum.js build/rfxh
      - uses: actions/upload-artifact@v4
        with:
          name: rfxh-android-x86_64
          path: build/rfxh*

  build-windows:
    name: windows-x86_64
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@v2
      - name: Configure
        shell: bash
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        shell: bash
        run: cmake --build build --parallel
      - name: Checksum
        run: node .github/scripts/checksum.js build/rfxh.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rfxh-windows-x86_64
          path: |
            build/rfxh.exe
            build/rfxh.exe.sha256

  release:
    needs:
      - setup
      - build-linux
      - build-macos-x86_64
      - build-macos-arm64
      - build-android-arm64
      - build-android-x86_64
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Stage Release Assets
        run: node .github/scripts/stage-assets.js artifacts release
      - name: Gzip Binaries
        run: node .github/scripts/gzip.js artifacts pack
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-pack
          path: pack/
          compression-level: 0
      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    if: ${{ !cancelled() && needs.setup.outputs.notify_message_id != '' }}
    needs: [setup, release]
    runs-on: ubuntu-latest
    steps:
      # checkout is only here so the caption step can require lib/ from the repo.
      - uses: actions/checkout@v4
      - name: Download Pack
        if: ${{ needs.release.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: telegram-pack
          path: pack/
      - name: Collect Binaries
        id: files
        if: ${{ needs.release.result == 'success' }}
        run: node .github/scripts/collect-binaries.js pack
      - name: Build Caption
        id: caption
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        with:
          script: require(process.env.GITHUB_WORKSPACE + '/.github/actions/telegram-notify/lib/caption.js')(github, context, core)
      - name: Notify Release Complete
        if: ${{ needs.release.result == 'success' && needs.setup.outputs.notify_message_id != '' }}
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          type: complete
          binary_files: ${{ steps.files.outputs.files }}
          edit_message_id: ${{ needs.setup.outputs.notify_message_id }}
          caption: ${{ steps.caption.outputs.caption }}
      - name: Notify Failure
        if: ${{ needs.release.result != 'success' && needs.setup.outputs.notify_message_id != '' }}
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          type: failure
          edit_message_id: ${{ needs.setup.outputs.notify_message_id }}
          caption: ${{ steps.caption.outputs.caption }}
